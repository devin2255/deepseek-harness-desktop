# Keyless real-Loader composition for inherited and deployment-selected child
# policy. Both scenarios leave the deployment writable; only the recorded
# child policy prevents the delegated write from reaching disk.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

# file/override/childFiles all default to their DSH_SNAPSHOT_* env vars.
- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

# The filesystem Provider enforces the recorded child policy. The root keeps
# the writable deployment mode unless its seeded log supplies an override.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_SNAPSHOT_PARENT_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
    delegationMode: !!js process.env.DSH_SNAPSHOT_DELEGATION_MODE ?? 'inherit'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# This scenario probes filesystem confinement only, so the bash stack is absent:
# without it the bundle's `toolBash: false` is required, because `tool-bash` would
# otherwise wait forever for a `bash` executor this tree never mounts.
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/subagent-inheritance-agent.ts'
