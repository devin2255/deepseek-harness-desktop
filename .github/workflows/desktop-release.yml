name: Release (Desktop Windows)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed Windows installer from the selected dsh-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: Desktop-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    name: Sign, qualify, and publish Windows x64
    if: inputs.publish
    runs-on: windows-2025
    timeout-minutes: 90
    environment: desktop-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify protected release ref
        id: ref
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Desktop production release requires a selected tag.' }
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "dsh-v$version") { throw "Desktop tag does not match version $version." }
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release tag is not reachable from origin/master.' }

      - name: Build workspace artifacts
        id: build
        run: pnpm run build

      - name: Build signed installer
        id: package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([String]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [String]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'The protected desktop signing certificate configuration is incomplete.'
          }
          pnpm run desktop:package

      - name: Validate package and release files
        id: validate
        run: node --import tsx/esm scripts/desktop/validate-package.ts

      - name: Require production signatures and tag identity
        id: production
        run: node --import tsx/esm scripts/desktop/verify-production-release.ts

      - name: Complete signed installer E2E matrix
        id: matrix
        env:
          DSH_INSTALLER_E2E: '1'
        run: node node_modules/vitest/vitest.mjs run --config vitest.desktop-installer.config.ts

      - name: Revalidate the exact publishable bytes
        id: final
        run: node --import tsx/esm scripts/desktop/verify-production-release.ts

      - name: Attest installer build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/desktop/installer/DeepSeek-Harness-Setup-*-x64.exe

      - name: Retain qualified signed release files
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-signed-${{ github.sha }}
          path: |
            .artifacts/desktop/installer/*.exe
            .artifacts/desktop/installer/*.exe.sha256
            .artifacts/desktop/installer/release-metadata.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Publish immutable GitHub release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadataPath = '.artifacts/desktop/installer/release-metadata.json'
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $installer = Join-Path '.artifacts/desktop/installer' $metadata.artifact
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $installer, "$installer.sha256", $metadataPath,
            '--verify-tag', '--generate-notes', '--fail-on-no-commits',
            '--title', "DeepSeek Harness Desktop $($metadata.version)",
            '--notes', 'Signed Windows x64 installer. Download the Setup EXE; verify its SHA-256 sidecar or GitHub artifact attestation before installation.'
          )
          if ($metadata.version.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
