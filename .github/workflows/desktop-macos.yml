name: Desktop macOS arm64 smoke

on:
  pull_request:
  push:
    branches: [master]
    tags: ['dsh-v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop:
    name: macOS arm64 / desktop runtime
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace artifacts
        run: pnpm run build

      - name: Exercise desktop entry and windows
        run: pnpm run test:desktop:e2e:ci
